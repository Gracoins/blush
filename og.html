<!DOCTYPE html>
<html lang="tr"><head><meta charset="UTF-8" />
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Jost:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1200px;height:630px;overflow:hidden;display:flex;font-family:'Jost',sans-serif;background:#2e2523;color:#fff;position:relative}
  .g1{position:absolute;width:640px;height:640px;border-radius:50%;left:-220px;bottom:-260px;background:radial-gradient(circle,rgba(226,189,178,.30),transparent 68%)}
  .g2{position:absolute;width:400px;height:400px;border-radius:50%;left:250px;top:-210px;background:radial-gradient(circle,rgba(191,154,92,.26),transparent 68%)}
  .left{flex:1.12;padding:0 60px;display:flex;flex-direction:column;justify-content:center;position:relative;z-index:1}
  .row{display:flex;align-items:center;gap:20px;margin-bottom:26px}
  .mk{width:80px;height:80px;border-radius:50%;border:1px solid #bf9a5c;display:grid;place-items:center;flex:none;
      font-family:'Marcellus',serif;font-size:36px;color:#dcbc82}
  .badge{font-size:12.5px;letter-spacing:.34em;text-transform:uppercase;color:#dcbc82;font-weight:500}
  .brand{font-family:'Marcellus',serif;font-size:54px;line-height:1.05;letter-spacing:.07em}
  .tag{font-size:43px;font-weight:600;letter-spacing:-.02em;line-height:1.14;margin-top:4px}
  .grad{background:linear-gradient(100deg,#bf9a5c,#eccf9a 44%,#e2bdb2);-webkit-background-clip:text;background-clip:text;color:transparent}
  .pf{font-family:'Marcellus',serif;font-weight:400}
  .sub{font-size:19px;color:rgba(255,255,255,.6);margin-top:18px}
  .chips{display:flex;gap:10px;margin-top:28px;flex-wrap:wrap}
  .chips span{border:1px solid rgba(255,255,255,.2);padding:9px 19px;border-radius:100px;font-size:15px;color:rgba(255,255,255,.86)}
  .chips span.p{background:#bf9a5c;border-color:#bf9a5c;color:#fff;font-weight:500}
  .right{flex:.88;position:relative;background:#3d312e url('img/salon.jpg') center 22%/cover no-repeat}
  .right::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#2e2523,transparent 34%)}
</style></head>
<body>
  <div class="g1"></div><div class="g2"></div>
  <div class="left">
    <div class="row">
      <div class="mk">B</div>
      <div>
        <div class="badge">Adana · Ziyapaşa</div>
        <div class="brand">Blush</div>
      </div>
    </div>
    <div class="tag">Kendinize <span class="pf grad">bir saat ayırın.</span></div>
    <div class="sub">Lazer · Cilt bakımı · Tırnak · Kaş &amp; Kirpik · Makyaj</div>
    <div class="chips"><span class="p">Online Randevu</span><span>Ziyapaşa Blv.</span><span>Dante üzeri</span></div>
  </div>
  <div class="right"></div>
</body></html>
